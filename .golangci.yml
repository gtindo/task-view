# golangci-lint v2 config enforcing the code rules in AGENTS.md.
version: "2"

linters:
  default: standard
  enable:
    - depguard # package boundaries
    - nlreturn # rule 2: spacing
    - nestif # rule 3: guard clauses
    - gocognit # rules 3 and 6: shallow, readable control flow
    - revive # rules 3 and 8: early returns, doc comments
    - varnamelen # rule 4: names
    - mnd # rule 5: magic values

  settings:
    nlreturn:
      block-size: 2
    nestif:
      min-complexity: 4
    gocognit:
      min-complexity: 30
    varnamelen:
      min-name-length: 2
      max-distance: 1
      check-receiver: false
      check-return: true
      check-type-param: true
      ignore-names: [i, j, k, err, ok, id]
      ignore-decls:
        - t *testing.T
        - t testing.TB
    mnd:
      checks: [argument, case, condition, operation, return, assign]
      ignored-numbers: ["0", "1", "2", "-1", "0o644", "0o755"]
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
    depguard:
      rules:
        # Only gitx runs Git; cmd opens the browser; fixture builds test repos.
        exec:
          files:
            - "$all"
            - "!**/internal/gitx/**"
            - "!**/internal/fixture/**"
            - "!**/cmd/change-view/**"
          deny:
            - pkg: os/exec
              desc: only internal/gitx runs commands (read-only by design)
        leaves:
          files:
            - "**/internal/gitx/**"
            - "**/internal/langs/**"
            - "**/internal/instructions/**"
          deny:
            - pkg: github.com/gtindo/changes-view/internal
              desc: gitx, langs and instructions depend on nothing internal
        review:
          files:
            - "**/internal/review/**"
          deny:
            - pkg: github.com/gtindo/changes-view/internal/engine
              desc: review depends only on langs
            - pkg: github.com/gtindo/changes-view/internal/render
              desc: review depends only on langs
            - pkg: github.com/gtindo/changes-view/internal/gitx
              desc: review depends only on langs
            - pkg: github.com/gtindo/changes-view/internal/fixture
              desc: fixture is for tests only
        engine:
          files:
            - "**/internal/engine/**"
            - "!$test"
          deny:
            - pkg: github.com/gtindo/changes-view/internal/render
              desc: engine never depends on the page
            - pkg: github.com/gtindo/changes-view/internal/fixture
              desc: fixture is for tests only
        render:
          files:
            - "**/internal/render/**"
            - "!$test"
          deny:
            - pkg: github.com/gtindo/changes-view/internal/fixture
              desc: fixture is for tests only

  exclusions:
    rules:
      # Tests and fixtures: literals are data there, and short names in table
      # tests read fine.
      - path: (_test\.go|internal/fixture/)
        linters: [mnd, varnamelen]
